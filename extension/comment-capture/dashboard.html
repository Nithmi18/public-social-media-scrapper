<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Capture</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1><img src="icons/icon48.png" alt="" class="logo">Comment Capture</h1>
      <p id="status" role="status"></p>
    </div>
    <div class="top-actions">
      <button id="refresh" class="primary">Refresh</button>
      <button id="openSettings" class="ghost" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Channels"></nav>

  <main id="view" hidden>
    <section class="stats">
      <div class="stat"><span class="label">Posts with new comments</span><span id="statPending" class="value"></span></div>
      <div class="stat"><span class="label">New comments</span><span id="statNew" class="value"></span></div>
      <div class="stat"><span class="label">Last capture</span><span id="statLast" class="value small"></span></div>
      <div class="stat"><span class="label">Schedule</span><span id="statSchedule" class="value small"></span></div>
    </section>

    <section class="toolbar">
      <div class="segmented" role="group" aria-label="Show">
        <button data-filter="pending" class="on">New comments</button>
        <button data-filter="all">All posts</button>
      </div>
      <input id="search" type="search" placeholder="Search captions">
      <label class="field">Posts from
        <select id="days"><option value="3">last 3 days</option><option value="7" selected>last 7 days</option><option value="14">last 14 days</option><option value="30">last 30 days</option></select>
      </label>
      <label class="field">Sort
        <select id="sort"><option value="new">Most new comments</option><option value="recent">Newest posts</option></select>
      </label>
      <button id="openNext" class="primary">Open next post</button>
    </section>

    <ol id="posts" class="posts"></ol>
    <p id="empty" class="empty" hidden></p>
  </main>

  <dialog id="settings">
    <form id="settingsForm" method="dialog">
      <h2>Settings</h2>
      <label>Supabase project URL <input id="baseUrl" type="url" placeholder="https://xxxx.supabase.co" required></label>
      <label>Capture key <input id="captureKey" type="password" pattern="[a-f0-9]{64}" required></label>
      <p class="hint">The key stays in this browser and is only sent to your Supabase project.</p>
      <div class="dialog-actions">
        <button type="button" id="closeSettings" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="dashboard.js"></script>
</body>
</html>
